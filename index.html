<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title><meta name="theme-color" content="#000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ac:#ff4d2e;--glow:rgba(255,77,46,.22);--dim:#8b93a3;--ln:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:#000;color:#fff;font:15px/1.6 Inter,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}button{font:inherit;background:none;border:0;color:inherit;cursor:pointer}img{max-width:100%;display:block}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.wrap{max-width:1200px;margin:auto;padding:0 5vw}section{padding:110px 0;position:relative}
.mega,.t{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.04em;line-height:.92;text-transform:none;background:linear-gradient(180deg,#fff 25%,#7d8596 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.t{font-size:clamp(54px,11vw,150px);margin-bottom:40px}
.mono{font:500 11px 'Space Grotesk',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}.mono b{color:var(--ac);font-weight:500}
.glass{background:rgba(255,255,255,.045);border:1px solid var(--ln);border-radius:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
/* nav */
header{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 5vw;mix-blend-mode:normal}
.logo{font:700 13px 'Space Grotesk';letter-spacing:.14em;text-transform:uppercase}
.nl{display:flex;gap:26px}.nl a{font:500 11px 'Space Grotesk';letter-spacing:.16em;text-transform:uppercase;color:#cfd4de}.nl a:hover,.nl a.cur{color:var(--ac)}
.burger{display:none;padding:6px}.burger span{display:block;width:22px;height:2px;background:#fff;margin:5px 0}
.mmenu{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.94);display:none;flex-direction:column;justify-content:center;gap:18px;padding:0 10vw}.mmenu.show{display:flex}.mmenu a{font:700 40px 'Space Grotesk';letter-spacing:-.03em}
@media(max-width:820px){.nl{display:none}.burger{display:block;position:relative;z-index:101}}
/* preloader */
#pre{position:fixed;inset:0;background:#000;z-index:500;display:grid;place-items:center;transition:opacity .7s .1s}
#pre i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 60px 20px rgba(255,255,255,.25);transition:transform .5s,opacity .3s}
#pre b{position:absolute;font:700 clamp(48px,14vw,170px) 'Space Grotesk';letter-spacing:-.04em;opacity:0;background:linear-gradient(180deg,#fff,#7d8596);-webkit-background-clip:text;background-clip:text;color:transparent}
#pre.go i{transform:scale(0);opacity:0}#pre.go b{opacity:1}#pre.done{opacity:0;pointer-events:none}
/* hero */
.hero{min-height:100svh;padding:0;display:grid;place-items:center;overflow:hidden}
.stage{position:relative;width:min(100%,900px);height:min(100svh,900px);display:grid;place-items:end center}
#ht{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);height:86%;max-width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1) contrast(1.2)}
.hero .mega{position:relative;font-size:clamp(46px,15.5vw,190px);margin-bottom:12vh;text-shadow:0 0 1px #000}
.sub{position:absolute;left:5vw;bottom:8vh;font:700 17px 'Space Grotesk'}.sub i{display:block;font:italic 22px 'Instrument Serif',serif;color:#cfd4de}
.scroll{position:absolute;right:5vw;bottom:8vh}
/* intro */
.intro{display:grid;grid-template-columns:1fr 1.1fr;gap:5vw;align-items:center}
.card{padding:30px}.card p{color:#c4cad6;font-size:16.5px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}.facts div{border-top:1px solid var(--ln);padding-top:12px}
.num{font:700 clamp(28px,4vw,42px) 'Space Grotesk';letter-spacing:-.03em;line-height:1.1}.facts .l{font-size:12.5px;color:var(--dim);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:860px){.intro{grid-template-columns:1fr}}
/* skills */
.skills{display:grid;grid-template-columns:1.6fr 1fr;gap:5vw;align-items:end}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px}.sg h4{margin-bottom:12px}
.sg li{list-style:none;padding:5px 0;border-bottom:1px solid var(--ln);color:#d5dae4;font-size:14px;cursor:pointer;transition:.2s}.sg li.on{color:var(--ac);padding-left:10px}
.skills .t{text-align:right;font-size:clamp(44px,7vw,96px)}
@media(max-width:860px){.skills{grid-template-columns:1fr}.skills .t{order:-1;text-align:left}}
/* career rows */
.row{border-top:1px solid var(--ln)}.row:last-child{border-bottom:1px solid var(--ln)}
.acc-h{display:grid;grid-template-columns:60px 1fr auto 30px;gap:18px;align-items:center;width:100%;padding:26px 0;text-align:left}
.acc-h .n{font:500 13px 'Space Grotesk';color:var(--dim)}.acc-h h3{font:700 clamp(17px,2.4vw,26px) 'Space Grotesk';letter-spacing:-.02em;text-transform:uppercase}
.acc-h small{display:block;font:400 13px Inter;color:var(--dim);text-transform:none;letter-spacing:0;margin-top:2px}.acc-h .w{font:500 12px 'Space Grotesk';color:var(--dim);white-space:nowrap}
.acc-h .x{color:var(--ac);font-size:22px;transition:.3s}.acc.open .x{rotate:45deg}.row.on{border-color:var(--ac)!important;box-shadow:none}
.acc-b ul{list-style:none;padding:0 0 10px 78px}.acc-b li{margin-bottom:9px;color:#b9c0cd;max-width:70ch}.acc-b li::before{content:'→ ';color:var(--ac)}
.tools{padding:0 0 28px 78px;font:500 11px 'Space Grotesk';letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
@media(max-width:640px){.acc-h{grid-template-columns:34px 1fr 24px}.acc-h .w{grid-column:2}.acc-b ul,.tools{padding-left:0}}
/* projects */
.proj{display:grid;grid-template-columns:1.1fr 1fr;gap:4vw;align-items:center;margin-bottom:70px}.proj:nth-child(even){direction:rtl}.proj:nth-child(even)>*{direction:ltr}
.shot{padding:18px;color:var(--ac);overflow:hidden}.shot svg{width:100%;height:auto;display:block}
.proj h3{font:700 clamp(30px,5vw,64px) 'Space Grotesk';letter-spacing:-.04em;line-height:.95;text-transform:uppercase}.proj h3 i{display:block;font:italic 400 .8em 'Instrument Serif',serif;text-transform:none;letter-spacing:0;color:#cfd4de}
.btn{display:inline-flex;gap:8px;margin-top:22px;padding:13px 22px;border-radius:99px;background:var(--ac);color:#140603;font:700 12px 'Space Grotesk';letter-spacing:.1em;text-transform:uppercase;transition:.2s}.btn:hover{box-shadow:0 0 30px var(--glow);translate:0 -2px}
.btn.g{background:none;color:#fff;border:1px solid var(--ln)}.btn.g:hover{border-color:var(--ac)}
@media(max-width:860px){.proj{grid-template-columns:1fr}.proj:nth-child(even){direction:ltr}}
/* LED */
.led{padding:80px 0}.ledbox{padding:20px;position:relative}#led{width:100%;display:block;touch-action:pan-y}.ledbox .mono{margin-bottom:14px;display:block}
/* creds */
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:50px}.cg .card{padding:22px;font-size:14px}.cg .card b{display:block;color:var(--ac);margin-bottom:8px;font:500 11px 'Space Grotesk';letter-spacing:.14em}
/* contact */
.ct{display:grid;grid-template-columns:1.1fr .9fr;gap:5vw;align-items:center}.ct .t{font-size:clamp(46px,8vw,110px)}.ct .t i{font:italic 400 1em 'Instrument Serif',serif;color:var(--ac);-webkit-text-fill-color:var(--ac)}
.crow{display:flex;justify-content:space-between;gap:14px;padding:15px 0;border-top:1px solid var(--ln);font-size:14px;word-break:break-word}.crow:first-child{border:0}.crow a{text-align:right}.crow a:hover{color:var(--ac)}
@media(max-width:860px){.ct{grid-template-columns:1fr}}
footer{padding:30px 5vw 50px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid var(--ln)}
.ph{display:grid;place-items:center;font:700 80px 'Space Grotesk';color:#444;height:100%}
</style></head><body>
<div id="pre"><i></i><b id="pn"></b></div>
<canvas id="bg"></canvas><div id="bar"></div><div id="tip"></div>
<header><a class="logo" href="#home" id="logo"></a><nav class="nl" id="links"></nav><button class="burger" id="bb" aria-label="Menu" aria-expanded="false"><span></span><span></span></button></header>
<div class="mmenu" id="mm"></div>
<main id="app"></main>
<script src="common.js"></script>
<script>
load(init);
function init(d){
  const nm=d.name.split(' '),role=d.headline.split(/[|•]/).map(x=>x.trim());
  document.title=`${d.name} | ${role[0]}`;$('#logo').textContent=d.name;
  const nav=[['home','Home'],['intro','About'],['skills','Skills'],['career','Career'],['projects','Projects'],['contact','Contact']];
  $('#links').innerHTML=$('#mm').innerHTML=nav.map(([i,t])=>`<a href="#${i}">${t}</a>`).join('');
  const tag=(d.tagline||'Turning Data Into Decisions').replace(/\.$/,'');
  const [r1,r2]=role[0].split(/\s*&\s*/);
  $('#app').innerHTML=`
  <section id="home" class="hero"><div class="stage"><canvas id="ht"></canvas><h1 class="mega rv">PORTFOLIO</h1>
    <div class="sub rv">${E(role[0].split(' & ')[0])}<i>${E(role[0].split(' & ')[1]||role[1]||'')}</i></div><div class="scroll mono">Scroll ↓</div></div></section>
  <section id="intro"><div class="wrap"><div class="intro"><h2 class="t rv">Intro</h2><div class="card glass tilt rv"><p>${E(d.summary)}</p>
    <div class="facts">${d.kpis.slice(0,4).map(k=>`<div><div class="num" data-v="${E(k.value)}">${E(k.value)}</div><div class="l">${E(k.label)}</div></div>`).join('')}</div></div></div></div></section>
  <section id="skills"><div class="wrap"><div class="skills"><div class="sg" data-focus>${d.skills.map(g=>`<div class="rv"><h4 class="mono"><b>●</b> ${E(g.group)}</h4><ul>${g.items.map(s=>`<li data-tip="${E(tipOf(d,s,g.group))}">${E(s)}</li>`).join('')}</ul></div>`).join('')}</div><h2 class="t rv">What<br>I do</h2></div></div></section>
  <section id="career"><div class="wrap"><h2 class="t rv">Career</h2><div data-focus>${d.experience.map((e,i)=>`<div class="row acc foc rv${i?'':' open'}"><button class="acc-h"><span class="n">0${i+1}</span><h3>${E(e.role)}<small>${E(e.company)}${e.place?' · '+E(e.place):''}</small></h3><span class="w">${E(e.period)}</span><span class="x">+</span></button><div class="acc-b"><div><ul>${e.bullets.map(b=>`<li>${E(b)}</li>`).join('')}</ul><div class="tools">${E(e.tools.join(' · '))}</div></div></div></div>`).join('')}</div></div></section>
  <section id="projects"><div class="wrap"><h2 class="t rv">Featured<br>projects</h2><div data-focus>${d.projects.map((p,i)=>{const w=p.name.replace(/\s*\(.*?\)\s*/g,' ').trim().split(' '),last=w.pop();
    return `<div class="proj"><a ${p.url?`href="${E(p.url)}" target="_blank" rel="noopener"`:''} class="shot glass tilt rv">${viz(p.name)}</a><div class="rv"><div class="mono"><b>0${i+1}</b> / Dashboard</div><h3>${E(w.join(' '))}<i>${E(last)}</i></h3>${p.url?`<a class="btn" target="_blank" rel="noopener" href="${E(p.url)}">View project →</a>`:''}</div></div>`}).join('')}</div></div></section>
  <section class="led"><div class="wrap"><div class="ledbox glass rv"><span class="mono"><b>●</b> Interactive · push the dots</span><canvas id="led"></canvas></div></div></section>
  <section id="creds"><div class="wrap"><h2 class="t rv">Credentials</h2><div class="cg" data-focus>${d.certs.map(c=>`<div class="card glass tilt rv"><b>CERTIFIED</b>${E(c)}</div>`).join('')}${d.education.map(e=>`<div class="card glass tilt rv"><b>EDUCATION</b>${E(e.degree)}<div style="color:var(--dim);margin-top:6px">${E([e.institution,e.extra].filter(Boolean).join(' · '))}</div></div>`).join('')}</div></div></section>
  <section id="contact"><div class="wrap ct"><div><h2 class="t rv">Let’s work <i>together.</i></h2><a class="btn rv" href="mailto:${E(d.email)}">Email me</a> <a class="btn g rv" href="assets/CV.pdf" download>Download resume</a></div>
    <div class="card glass rv"><div class="crow"><span class="mono">Email</span><a href="mailto:${E(d.email)}">${E(d.email)}</a></div><div class="crow"><span class="mono">Phone</span><a href="tel:${E((d.phone||'').replace(/[^+\d]/g,''))}">${E(d.phone)}</a></div><div class="crow"><span class="mono">Location</span><span>${E(d.location)}</span></div>
    ${Object.entries(d.links||{}).map(([k,u])=>`<div class="crow"><span class="mono">${k}</span><a target="_blank" rel="noopener" href="${E(u)}">${E(u.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''))}</a></div>`).join('')}</div></div></section>
  <footer><span class="mono">© ${new Date().getFullYear()} ${E(d.name)}</span><span class="mono">${E(d.location)}</span></footer>`;
  behave();stars();halftone();led(tag);preload(nm[0]);
}
function preload(n){const p=$('#pre'),b=$('#pn');let seen=0;try{seen=sessionStorage.getItem('pre')}catch(e){}
  if(RM||seen){p.remove();return}try{sessionStorage.setItem('pre',1)}catch(e){}
  const T=n.toUpperCase(),C='ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&';setTimeout(()=>{p.classList.add('go');const t0=performance.now();
    (function f(t){const k=t-t0;b.textContent=[...T].map((c,i)=>k>500+i*160?c:C[Math.random()*C.length|0]).join('');if(k<500+T.length*160+300)requestAnimationFrame(f);else{p.classList.add('done');setTimeout(()=>p.remove(),900)}})(t0)},700)}
function stars(){if(!window.THREE)return;try{const r=new THREE.WebGLRenderer({canvas:$('#bg'),alpha:true}),sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,100);
  r.setPixelRatio(Math.min(devicePixelRatio,2));const P=innerWidth<700?900:2600,g=new THREE.BufferGeometry(),a=new Float32Array(P*3);for(let i=0;i<a.length;i++)a[i]=(Math.random()-.5)*60;
  g.setAttribute('position',new THREE.BufferAttribute(a,3));const pts=new THREE.Points(g,new THREE.PointsMaterial({size:.06,color:0xffffff,transparent:true,opacity:.75}));sc.add(pts);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(4,.012,8,120),new THREE.MeshBasicMaterial({color:0xff4d2e,transparent:true,opacity:.35}));sc.add(ring);
  let mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
  const size=()=>{r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};size();addEventListener('resize',size);cam.position.z=8;
  (function f(t){t*=.001;pts.rotation.y=t*.012+S*1.2;pts.rotation.x=S*.6;ring.rotation.set(1.1+S*3,t*.1,S*2);cam.position.z=8-S*5;cam.position.x+=(mx*1.5-cam.position.x)*.04;cam.position.y+=(-my-cam.position.y)*.04;cam.lookAt(0,0,0);r.render(sc,cam);if(!RM)requestAnimationFrame(f)})(0)}catch(e){}}
function halftone(){const c=$('#ht'),im=new Image();im.onload=()=>{try{const H=c.clientHeight||600,W=c.clientWidth||480,cell=innerWidth<700?5:6,dpr=Math.min(devicePixelRatio,2);c.width=W*dpr;c.height=H*dpr;
  const cols=Math.ceil(W/cell),rows=Math.ceil(H/cell),o=document.createElement('canvas');o.width=cols;o.height=rows;const x=o.getContext('2d'),s=Math.max(cols/im.width,rows/im.height);
  x.drawImage(im,(cols-im.width*s)/2,0,im.width*s,im.height*s);const px=x.getImageData(0,0,cols,rows).data,g=c.getContext('2d');g.scale(dpr,dpr);g.fillStyle='#fff';
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const k=(j*cols+i)*4,l=(px[k]*.3+px[k+1]*.59+px[k+2]*.11)/255,v=Math.min(1,Math.max(0,(l-.12)*1.7));if(v>.04){g.beginPath();g.arc(i*cell+cell/2,j*cell+cell/2,v*cell*.55,0,6.3);g.fill()}}
  c.style.filter='none'}catch(e){}};im.src='assets/photo.jpg'}
function led(tag){const c=$('#led'),g=c.getContext('2d');let dots=[],W,H,cell,px=-999,py=-999;
  const build=()=>{const words=tag.toUpperCase().split(' '),mob=innerWidth<700,lines=[];let cur='';words.forEach(w=>{if((cur+' '+w).trim().length>(mob?9:15)&&cur){lines.push(cur);cur=w}else cur=(cur+' '+w).trim()});lines.push(cur);
    const LH=15,o=document.createElement('canvas'),x=o.getContext('2d');x.font='700 12px "Space Grotesk",sans-serif';const mw=Math.max(...lines.map(l=>x.measureText(l).width)),cols=Math.ceil(mw)+8,rows=lines.length*LH;
    o.width=cols;o.height=rows;x.font='700 12px "Space Grotesk",sans-serif';x.fillStyle='#fff';x.textBaseline='middle';lines.forEach((l,i)=>x.fillText(l,(cols-x.measureText(l).width)/2,(i+.5)*LH+1));
    const d=x.getImageData(0,0,cols,rows).data,Wc=c.parentElement.clientWidth-40;cell=Math.min(14,Wc/cols);W=Wc;H=rows*cell;const dpr=Math.min(devicePixelRatio,2);c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';g.setTransform(dpr,0,0,dpr,0,0);
    dots=[];for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const on=d[(j*cols+i)*4+3]>110;dots.push({hx:i*cell+cell/2,hy:j*cell+cell/2,x:i*cell+cell/2,y:j*cell+cell/2,vx:0,vy:0,on})}};
  build();addEventListener('resize',build);const set=e=>{const r=c.getBoundingClientRect();px=e.clientX-r.left;py=e.clientY-r.top};c.addEventListener('pointermove',set);c.addEventListener('pointerdown',set);c.addEventListener('pointerleave',()=>{px=py=-999});
  (function f(){g.clearRect(0,0,W,H);const R=cell*7;for(const p of dots){const dx=p.x-px,dy=p.y-py,d2=dx*dx+dy*dy;if(d2<R*R&&p.on){const d=Math.sqrt(d2)||1,F=(R-d)/R*3;p.vx+=dx/d*F;p.vy+=dy/d*F}
    p.vx+=(p.hx-p.x)*.06;p.vy+=(p.hy-p.y)*.06;p.vx*=.84;p.vy*=.84;p.x+=p.vx;p.y+=p.vy;const m=Math.hypot(p.x-p.hx,p.y-p.hy);
    g.fillStyle=p.on?(m>cell*.6?'#ff4d2e':'#fff'):'rgba(255,255,255,.07)';const s=cell*(p.on?.34:.14);g.beginPath();g.arc(p.x,p.y,s,0,6.3);g.fill()}
    requestAnimationFrame(f)})()}
</script></body></html>
